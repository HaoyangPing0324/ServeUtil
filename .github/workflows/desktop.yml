name: Desktop viewer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  viewer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[desktop]" pyinstaller pillow
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-xinerama0
          xcb=$(python -c "import sysconfig; from pathlib import Path; print(next(Path(sysconfig.get_paths()['purelib']).rglob('libqxcb.so')))")
          ldd "$xcb"
          xvfb-run -a python packaging/smoke_viewer.py
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - if: runner.os != 'Linux'
        run: python packaging/smoke_viewer.py
      - run: pyinstaller --noconfirm --windowed --icon assets/icon.png --name ServeUtil --collect-data serveutil packaging/viewer.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/archive.py
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - if: runner.os != 'Linux'
        run: python packaging/archive.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ServeUtil-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ServeUtil-*.zip
            dist/ServeUtil-*.tar.gz
            examples/h20-decode.html

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install . playwright "markdown-it-py>=3,<5"
      - run: python -m playwright install --with-deps chromium
      - run: python packaging/site.py
      - run: python packaging/smoke_web.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ServeUtil-web
          path: dist/site/

  profiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.10.0", "2.15.0"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install . numpy
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==${{ matrix.torch }}"
      - run: python -m unittest discover -s tests -v

  site_bundle:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, viewer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ServeUtil-web
          path: dist/site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ServeUtil-*-*
          path: desktop-artifacts
      - run: |
          python -m pip install "markdown-it-py>=3,<5"
          python packaging/portal.py dist/site --desktop-assets desktop-artifacts
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site

  deploy:
    needs: site_bundle
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release_desktop:
    if: github.event_name == 'release'
    needs: viewer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ServeUtil-*-*
          path: desktop-artifacts
      - name: Attach verified desktop archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          find desktop-artifacts -type f \( -name 'ServeUtil-*.zip' -o -name 'ServeUtil-*.tar.gz' \) -exec gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber {} +
