name: Desktop viewer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  viewer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[desktop]" pyinstaller pillow
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libegl1
          xvfb-run -a python packaging/smoke_viewer.py
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - if: runner.os != 'Linux'
        run: python packaging/smoke_viewer.py
      - run: pyinstaller --noconfirm --windowed --icon assets/icon.png --name ServeUtil --collect-data serveutil packaging/viewer.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/archive.py
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - if: runner.os != 'Linux'
        run: python packaging/archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: ServeUtil-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ServeUtil-*.zip
            dist/ServeUtil-*.tar.gz
            examples/h20-decode.html

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . playwright
      - run: python -m playwright install --with-deps chromium
      - run: python packaging/site.py
      - run: python packaging/smoke_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: ServeUtil-web
          path: dist/site/
