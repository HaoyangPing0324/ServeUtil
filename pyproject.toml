[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "serveutil"
version = "0.1.1"
description = "Compute and bandwidth profiling for LLM inference"
readme = "packaging/PYPI.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ijson>=3.2,<4", "prometheus-client>=0.17,<1", "nvidia-ml-py>=12.550.52"]

[project.scripts]
serveutil = "serveutil.cli:main"

[tool.setuptools]
packages = ["serveutil"]
include-package-data = false

[project.optional-dependencies]
gpu = []
llmperfscope = ["llmperfscope>=0.2,<1"]
pm = ["cupti-python>=13.4,<14; sys_platform == 'linux'"]

[project.urls]
Documentation = "https://haoyangping0324.github.io/ServeUtil/"
Source = "https://github.com/HaoyangPing0324/ServeUtil"
Issues = "https://github.com/HaoyangPing0324/ServeUtil/issues"
